services:
  - type: web
    name: clipforge
    runtime: node
    repo: https://github.com/ibrahimabubacar788-tech/clipforge
    branch: main
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/ready
    autoDeploy: true
    plan: free
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
