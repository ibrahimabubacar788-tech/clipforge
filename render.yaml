services:
  - type: web
    name: clipforge
    runtime: docker
    repo: https://github.com/ibrahimabubacar788-tech/clipforge
    branch: assistant/production-hardening
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/ready
    autoDeploy: true
    plan: free
    envVars:
      - key: PORT
        value: 4173
      - key: NODE_ENV
        value: production
    disk:
      name: clipforge-data
      mountPath: /app/data
      sizeGB: 10
